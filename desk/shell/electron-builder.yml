appId: cn.zbswork.desktop
productName: ZBSwork
directories:
  output: dist
  buildResources: assets
files:
  - src/**
  - package.json
win:
  target: nsis
  icon: assets/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: ZBSwork-Setup-${env.ZBSWORK_DISPLAY_VERSION}.${ext}
mac:
  target: dmg
  category: public.app-category.productivity
  identity: null
  icon: assets/icon.png
  artifactName: ZBSwork-${env.ZBSWORK_DISPLAY_VERSION}-${arch}.${ext}
publish: null
