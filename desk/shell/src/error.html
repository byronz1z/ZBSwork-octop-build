<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>连接失败 - ZBSwork</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; background: #f5f5f5;
         display: flex; align-items: center; justify-content: center;
         height: 100vh; margin: 0; color: #333; }
  .box { text-align: center; background: #fff; padding: 48px 64px;
         border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.1); }
  h1 { font-size: 20px; margin-bottom: 8px; }
  .code { color: #999; font-size: 13px; margin-bottom: 24px; }
  button { font-size: 15px; padding: 10px 32px; border: none; border-radius: 4px;
           background: #2f6fed; color: #fff; cursor: pointer; }
  button:hover { background: #255fd0; }
</style>
</head>
<body>
<div class="box">
  <h1>连不上服务器，正在重试…</h1>
  <div class="code" id="errcode"></div>
  <button onclick="window.zbswork.retry()">立即重试</button>
</div>
<script>
  const code = new URLSearchParams(location.search).get('code');
  if (code) document.getElementById('errcode').textContent = '错误码：' + code;
  setInterval(() => window.zbswork.retry(), 10000);
</script>
</body>
</html>
