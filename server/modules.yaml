# 模块清单（机读 + 中文说明）—— 本库唯一的模块登记处
# - shared/tools/prepare.py      按 order 顺序应用 status=enabled 的补丁
# - shared/tools/check_ownership.py  模块隔离门禁：同一上游文件只能有一个主人模块
#
# 分层、编号、隔离规则记录在项目的本机指挥部目录：全景.md、规范.md
# 编号 = 一块改动区域，终身不变；重做不换号；只有需求取消或官方已实现才作废（作废号不再使用）
# 编号段：10–19 修复(fix) · 20–49 功能(feat，一个功能领域一个号) · 60 镜像打包(svc，仅此一个)；桌面端是单独一条线 desk/，不占编号段
# 层级：L0 配置 · L1 插件 · L2 外部服务 · L3 核心补丁（本表 patches 全部是 L3）
# 状态：enabled 启用 / candidate 候选（不参与构建）

# 2026-10-12 ZT-025 官方升级（task/ZT-025-official-upgrade）：上游锁定升至 v1.0.2b6（eb28011249c0）。
# 本机适配实测（build 任务克隆）：check_ownership.py、brand_check.py --self、build_image.py --no-build
# 均退出码 0；版本锁核对、补丁 10/60 共 3 个 patch 严格 apply、品牌检查全部通过。
# 生产b4信息来源为ZT-023记录，本任务未实测当前生产；原in_production字段保留，不据本机适配结果改写。
upstream_lock: UPSTREAM.lock

brand:
  name_zh: 品牌包（三类 logo + 产品名；网页端 + 桌面端）
  spec: server/brand/brand.yaml
  apply: shared/tools/brand_apply.py
  check: shared/tools/brand_check.py
  status: enabled
  verified: {v1.0.2b4: clean, v1.0.2b6: clean}
  pending: "第一期扩充：语言包全量、桌面 Mac 全量、桌面图标改为直接取定稿（见 Issue）"

patches:
  - id: 10-fix-pg-bootstrap-marker
    name_zh: PostgreSQL 模式重启死循环修复
    layer: L3
    scope: [docker]
    status: enabled
    order: 10
    upstream_pr: yes          # 上游 b6/main 仍未修，应提 PR；上游合并等价修复后删除本模块（编号作废）
    verified: {v1.0.2b4: strict, v1.0.2b6: strict}
    in_production: yes        # 生产镜像 octop:pg-1.0.2b4-r2 含此逻辑（2026-10-08 实测）
    legacy_ids: [SRV-1]

  - id: 20-feat-user-model-policy
    name_zh: 按角色/用户的可用模型名单；接口对非管理员不返回模型密钥（F7–F11）
    layer: L3
    scope: [docker]
    status: enabled
    order: 20
    upstream_pr: no           # ZBS 自有权限收紧策略，上游无意向；设计见 patches/20-*/README.md
    verified: {v1.0.2b6: strict}
    in_production: no         # 2026-10-13 新增（ZT-026 第 2 步），本机单元/集成测试通过，未部署

  - id: 21-feat-user-sandbox
    name_zh: 按用户沙箱——默认进沙箱、普通用户不能改运行方式（F3/F4/F5）
    layer: L3
    scope: [docker]
    status: enabled
    order: 21
    upstream_pr: no           # ZBS 自有权限收紧策略，上游无意向；设计见 patches/21-*/README.md
    verified: {v1.0.2b6: strict}
    in_production: no         # 2026-10-12 新增（ZT-026 第 2 步），本机单元测试通过，未部署

  - id: 60-svc-runtime-extras
    name_zh: 镜像加装本地向量/OCR 依赖（uv extras）+ 用户实际用到的工具（0002，ZT-018）
    layer: L3
    scope: [docker]
    status: enabled
    order: 60
    upstream_pr: no           # 体积取舍属部署偏好
    verified: {v1.0.2b4: strict, v1.0.2b6: strict}
    in_production: partially  # 0001（fastembed/rapidocr 等）已在生产（2026-10-08 实测）；0002 2026-10-10 新增，经本机镜像 octop:1.0.2b4-zbs1 验证，尚未部署到生产
    legacy_ids: [SRV-2]

# 同一上游文件被多个模块修改时，必须在此登记主人（owner）与允许共改的模块（also），否则 CI 失败。
# 补丁 20（order 20）与补丁 21（order 21）共改两个后端文件：都在不同位置追加代码，
# 按 order 先后（10→20→21）可严格套上（2026-10-13 prepare.py --check-only 实测）。
shared_files:
  src/octop/infra/users/resource_policy.py: {owner: 21-feat-user-sandbox, also: [20-feat-user-model-policy], reason: "21 加沙箱开关读取函数，20 加 allowed_models 策略函数，不同位置"}
  src/octop/infra/agents/manager.py: {owner: 21-feat-user-sandbox, also: [20-feat-user-model-policy], reason: "21 改 AgentManager.create/加沙箱后端覆写，20 改 resolve_fallback_model_ref，不同位置"}
  dashboard/src/locales/zh.json: {owner: brand, also: [20-feat-user-model-policy], reason: "品牌只替换值不动 key；20 新增 adminUsers 段的 key（先套 20 再套品牌，均严格 apply）"}
  dashboard/src/locales/en.json: {owner: brand, also: [20-feat-user-model-policy], reason: "同 zh.json"}

# 旧 AI 线产物（20-feat-model-per-user、50-desk-cloud-shell、51-desk-window-resize、brand/legacy）未经用户确认，不占编号；
# 代码只留在归档 tag archive/2026-10/build-init 供追溯，不作参考。
