# 本流程 2026-10-10 新增（ZT-018），尚未在云端运行过。
# 手动触发：构建 octop:<上游版本>-<server/VERSION> 镜像并推到 ghcr.io。
name: build-image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0——recipe_rev.py 找"最后一次改配方输入的提交"需要完整历史
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: 构建镜像（上游 + 补丁 + 品牌 → context.tar → docker build）
        # 不传 --reference：云端直接克隆官方仓库（prepare_lf.py 从 UPSTREAM.lock 取地址）
        # 只用官方源（指挥部规范 §5）：出镜像工具不传任何镜像源参数
        run: uv run --no-project --with pyyaml shared/tools/build_image.py --platform linux/amd64

      - name: 验证镜像
        # 同上，不传 --reference：施工树 .work/src 本身就是官方仓库的克隆（带官方 tag），
        # verify_image.py 不传 --reference 时自动用它做比对来源，不写死任何本机路径
        run: |
          VERSION=$(uv run --no-project --with pyyaml python -c "
          import yaml, pathlib
          tag = yaml.safe_load(open('server/UPSTREAM.lock'))['tag'].lstrip('v')
          print(f'octop:{tag}-' + pathlib.Path('server/VERSION').read_text().strip())")
          uv run --no-project --with pyyaml shared/tools/verify_image.py "$VERSION"

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送镜像
        run: |
          VERSION=$(uv run --no-project --with pyyaml python -c "
          import yaml, pathlib
          tag = yaml.safe_load(open('server/UPSTREAM.lock'))['tag'].lstrip('v')
          print(f'{tag}-' + pathlib.Path('server/VERSION').read_text().strip())")
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag "octop:$VERSION" "ghcr.io/$OWNER/octop:$VERSION"
          docker push "ghcr.io/$OWNER/octop:$VERSION"
