# ZBSwork 品牌包定义（唯一事实来源）
# - slots: 三类 logo 槽位 → 上游文件。apply.py 按此复制素材。
# - text:  逐文件“精确字符串替换”。不用全局正则，上游改了原文时 check.py 会报“规则未命中”，
#          由人决定怎么改，而不是悄悄漏改或误改代码标识符。
# - locales: 语言包只替换“值”，不动 key；keep 里的词保持原样。
# - forbidden: check.py 在品牌化后的树里检查残留的上游品牌（仅用户可见范围）。

name: ZBSwork               # 产品显示名
upstream_name: Octop        # 上游显示名（被替换的词）

slots:
  square:                   # 方形 logo：浏览器图标、PWA 安装图标、桌面应用/托盘图标
    source: brand/assets/source/icon.svg            # 母本（矢量）
    source_raster: brand/assets/source/icon-1024.png # 母本（1024 位图）
    targets:
      - { from: brand/assets/dashboard-public/favico.svg,           to: dashboard/public/favico.svg }
      - { from: brand/assets/dashboard-public/apple-touch-icon.png, to: dashboard/public/apple-touch-icon.png }
      - { from: brand/assets/dashboard-public/pwa-192.png,          to: dashboard/public/pwa-192.png }
      - { from: brand/assets/dashboard-public/pwa-512.png,          to: dashboard/public/pwa-512.png }
      - { from: brand/assets/desktop/appicon.png,                   to: desktop/src/build/appicon.png }
      - { from: brand/assets/desktop/tray-icon.png,                 to: desktop/src/assets/tray-icon.png }
  horizontal:               # 横版 logo：网页侧栏、页头（移动端）、登录页、初始化页
    source: brand/assets/source/brand-horizontal.svg
    targets:
      - { from: brand/assets/dashboard-public/logo_horizontal_dark.png,  to: dashboard/public/logo_horizontal_dark.png,  note: 浅色主题用（深色字） }
      - { from: brand/assets/dashboard-public/logo_horizontal_white.png, to: dashboard/public/logo_horizontal_white.png, note: 深色主题用（白色字） }
  vertical:                 # 竖版 logo：网页启动闪屏、离线页
    source: brand/assets/source/brand-vertical.svg
    targets:
      - { from: brand/assets/dashboard-public/logo_vertical_dark.svg,  to: dashboard/public/logo_vertical_dark.svg,  note: 浅色主题用（深色字） }
      - { from: brand/assets/dashboard-public/logo_vertical_white.svg, to: dashboard/public/logo_vertical_white.svg, note: "深色主题用（应为白色字）⚠ 当前与深色版相同，待补素材" }

text:
  # ---------- 网页端（dashboard） ----------
  dashboard/index.html:
    - ['<meta name="apple-mobile-web-app-title" content="Octop" />', '<meta name="apple-mobile-web-app-title" content="ZBSwork" />']
    - ['<title>Octop</title>', '<title>ZBSwork</title>']
  dashboard/public/manifest.json:
    - ['"name": "Octop"', '"name": "ZBSwork"']
    - ['"short_name": "Octop"', '"short_name": "ZBSwork"']
  dashboard/public/offline.html:
    - ['<title>Octop — 离线中</title>', '<title>ZBSwork — 离线中</title>']
    - ['alt="Octop"', 'alt="ZBSwork"']
    - ['无法连接到 Octop 服务端', '无法连接到 ZBSwork 服务端']
  dashboard/src/components/PwaInstallPrompt/index.tsx:
    - ['将 Octop 安装为 App', '将 ZBSwork 安装为 App']
    - ['"安装"} Octop」', '"安装"} ZBSwork」']
    - ['Install Octop', 'Install ZBSwork']
  dashboard/src/layouts/Sidebar.tsx:
    - ['alt="Octop"', 'alt="ZBSwork"']
  dashboard/src/pages/Login/index.tsx:
    - ['alt="Octop"', 'alt="ZBSwork"']
  dashboard/src/pages/Setup/index.tsx:
    - ['alt="Octop"', 'alt="ZBSwork"']
  dashboard/src/pages/Chat/components/ChatInput.tsx:
