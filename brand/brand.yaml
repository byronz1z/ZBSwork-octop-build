  dashboard/src/pages/Chat/components/WelcomeScreen.tsx:
    - ['aria-label="Octop mascot"', 'aria-label="ZBSwork mascot"']
  dashboard/src/pages/Agent/Connectors/index.tsx:
    - ['在 Octop 主机终端', '在 ZBSwork 主机终端']
  dashboard/src/pages/Agent/Memory/CandidatesReview.tsx:
    - ['Octop 的建议', 'ZBSwork 的建议']
    - ['由 Octop 从对话中', '由 ZBSwork 从对话中']
  dashboard/src/pages/Agent/Memory/EpisodesList.tsx:
    - ['你与 Octop 相处', '你与 ZBSwork 相处']
    - ['帮 Octop 更好地', '帮 ZBSwork 更好地']
  dashboard/src/pages/Agent/Memory/MigrateMemory.tsx:
    - ['将当前 Octop 的全部记忆', '将当前 ZBSwork 的全部记忆']
    - ['对当前 Octop 的记忆库', '对当前 ZBSwork 的记忆库']
  dashboard/src/pages/Agent/Memory/ProactiveConfig.tsx:
    - ['让 Octop 在合适的时机', '让 ZBSwork 在合适的时机']
    - ['"Octop 会从你的情绪日记', '"ZBSwork 会从你的情绪日记']
  dashboard/src/pages/Agent/Memory/ProfileOverview.tsx:
    - ['Octop 还在了解你', 'ZBSwork 还在了解你']
    - ['最近被 Octop 记下', '最近被 ZBSwork 记下']
  dashboard/src/pages/Agent/Memory/ProfileOverview.test.tsx:
    - ['/Octop 还在了解你/', '/ZBSwork 还在了解你/']
  dashboard/src/pages/Control/RemoteBrowser/index.tsx:
    - ['卸载 Octop 自动安装', '卸载 ZBSwork 自动安装']
    - ['发给 Octop 排查', '发给 ZBSwork 排查']
    - ['"Octop 需要浏览器', '"ZBSwork 需要浏览器']
  dashboard/src/pages/Control/RemoteDesktop/DesktopPanel.tsx:
    - ['然后重启 Octop"', '然后重启 ZBSwork"', all]
    - ['发给 Octop 排查', '发给 ZBSwork 排查']
    - ['查看并操控 Octop 主机', '查看并操控 ZBSwork 主机']
    - ['控制 Octop 主机', '控制 ZBSwork 主机']
    - ['"重启 Octop（octop run）', '"重启 ZBSwork（octop run）']

  # ---------- 桌面端（desktop，Wails 壳） ----------
  desktop/src/Taskfile.yml:
    - ['APP_NAME: "Octop"', 'APP_NAME: "ZBSwork"']
    - ['Builds the Octop desktop shell', 'Builds the ZBSwork desktop shell']
  desktop/src/build/config.yml:
    - ['companyName: "Octop"', 'companyName: "ZBSwork"']
    - ['productName: "Octop"', 'productName: "ZBSwork"']
    - ['description: "Octop desktop shell"', 'description: "ZBSwork desktop shell"']
    - ['copyright: "(c) 2026, Octop"', 'copyright: "(c) 2026, ZBSwork"']
  desktop/src/build/windows/info.json:
    - ['"CompanyName": "Octop"', '"CompanyName": "ZBSwork"']
    - ['"FileDescription": "Octop desktop"', '"FileDescription": "ZBSwork desktop"']
    - ['"ProductName": "Octop"', '"ProductName": "ZBSwork"']
    - ['"Comments": "Octop desktop shell"', '"Comments": "ZBSwork desktop shell"']
  desktop/src/build/windows/nsis/wails_tools.nsh:
    - ['!define INFO_PROJECTNAME "Octop"', '!define INFO_PROJECTNAME "ZBSwork"']
    - ['!define INFO_COMPANYNAME "Octop"', '!define INFO_COMPANYNAME "ZBSwork"']
    - ['!define INFO_PRODUCTNAME "Octop"', '!define INFO_PRODUCTNAME "ZBSwork"']
    - ['!define INFO_COPYRIGHT "(c) 2026, Octop"', '!define INFO_COPYRIGHT "(c) 2026, ZBSwork"']
  desktop/src/main.go:
    - ['Name:        "Octop",', 'Name:        "ZBSwork",']
    - ['Description: "Octop desktop",', 'Description: "ZBSwork desktop",']
    - ['Title:                "Octop",', 'Title:                "ZBSwork",']
    - ['Title:            "Octop 设置",', 'Title:            "ZBSwork 设置",']
    - ['tray.SetTooltip("Octop")', 'tray.SetTooltip("ZBSwork")']
  desktop/src/preventsleep_linux.go:
    - ['"Octop",', '"ZBSwork",']
    - ['"Octop desktop is running",', '"ZBSwork desktop is running",']
  desktop/src/desktop_copy.go:
    - ['Octop', 'ZBSwork', all]
  desktop/src/desktop_copy_test.go:
    - ['"Octop 已就绪"', '"ZBSwork 已就绪"']
    - ['"Octop is ready"', '"ZBSwork is ready"', all]
  desktop/src/download_test.go:
    - ['"Octop 服务未在"', '"ZBSwork 服务未在"']
    - ['"Octop did not become ready within"', '"ZBSwork did not become ready within"', all]
    - ['"make sure Octop is running"', '"make sure ZBSwork is running"']
  desktop/src/assets/index.html:
    - ['<title>Octop</title>', '<title>ZBSwork</title>']
    - ['alt="Octop"', 'alt="ZBSwork"']
    - ['id="loading-brand">Octop</p>', 'id="loading-brand">ZBSwork</p>']
    - ['<h1 id="title">Octop 设置</h1>', '<h1 id="title">ZBSwork 设置</h1>']
    - ['id="show-main">显示 Octop</button>', 'id="show-main">显示 ZBSwork</button>']
    - ['title: "Octop 设置"', 'title: "ZBSwork 设置"']
    - ['showMain: "显示 Octop"', 'showMain: "显示 ZBSwork"']
    - ['title: "Octop Settings"', 'title: "ZBSwork Settings"']
    - ['keep Octop in the tray', 'keep ZBSwork in the tray']
    - ['while Octop is running', 'while ZBSwork is running']
    - ['showMain: "Show Octop"', 'showMain: "Show ZBSwork"']

locales:
  files:
    - dashboard/src/locales/zh.json
    - dashboard/src/locales/en.json
  keep: [OctopBot, OpenClaw]   # 外部产品名，保持原样

forbidden:
  # 品牌化后这些位置不允许再出现独立词 "Octop"（代码注释、文件名模式不在此列）
  word: Octop
  scan:
    - dashboard/index.html
    - dashboard/public/manifest.json
    - dashboard/public/offline.html
    - dashboard/src/locales/zh.json
    - dashboard/src/locales/en.json
    - desktop/src/desktop_copy.go
    - desktop/src/assets/index.html
    - desktop/src/build/config.yml
    - desktop/src/build/windows/info.json

