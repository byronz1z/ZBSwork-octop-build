# 模块清单（机读 + 中文说明）—— 本库唯一的模块登记处
# - tools/prepare.py      按 order 顺序应用 status=enabled 的补丁
# - tools/check_ownership.py  模块隔离门禁：同一上游文件只能有一个主人模块
#
# 编号段：10–19 修复(fix) · 20–49 功能(feat) · 50–59 桌面端(desk) · 60–69 服务端/镜像(svc)；退役编号不复用
# 状态：enabled 启用 / candidate 候选（不参与构建）
# 退役模块不保留目录：登记到文末 retired，代码留在归档 tag 里，不作为参考
# 功能分层与隔离规则：docs/总体方案与架构.md §4、§5

upstream_lock: UPSTREAM.lock

brand:
  name_zh: 品牌包（三类 logo + 产品名；网页端 + 桌面端）
  spec: brand/brand.yaml
  apply: brand/apply.py
  check: brand/check.py
  status: enabled
  verified: {v1.0.2b4: clean, v1.0.2b6: clean}
  pending: "第一期扩充：语言包全量、桌面 Mac 全量、桌面图标改为直接取定稿（见 Issue）"

patches:
  - id: 10-fix-pg-bootstrap-marker
    name_zh: PostgreSQL 模式重启死循环修复
    layer: L2
    scope: [docker]
    status: enabled
    order: 10
    upstream_pr: yes          # 上游 b6/main 仍未修，应提 PR；上游合并后本模块退役
    verified: {v1.0.2b4: strict, v1.0.2b6: strict}
    in_production: yes        # 生产镜像 octop:pg-1.0.2b4-r2 含此逻辑（2026-10-08 实测）
    legacy_ids: [SRV-1]

  - id: 60-svc-runtime-extras
    name_zh: 镜像加装本地向量与知识库 OCR 依赖（uv extras）
    layer: L2
    scope: [docker]
    status: enabled
    order: 60
    upstream_pr: no           # 体积取舍属部署偏好
    verified: {v1.0.2b4: strict, v1.0.2b6: strict}
    in_production: yes        # fastembed / rapidocr 等 5 包已装（2026-10-08 实测）
    legacy_ids: [SRV-2]

# 同一上游文件被多个模块修改时，必须在此登记主人（owner）与允许共改的模块（also），否则 CI 失败。
# 例：
#   desktop/src/main.go: {owner: 52-desk-server-url, also: [brand], reason: "品牌只改窗口标题文字"}
shared_files: {}

# 已退役（不参与构建、不作参考；需要追溯时看归档 tag）
